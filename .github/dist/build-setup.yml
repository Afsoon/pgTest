- name: Set compiled version and commit
  shell: bash
  run: |
    version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cli") | .version')
    echo "PGTEST_VERSION=$version" >> "$GITHUB_ENV"
    echo "PGTEST_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

- name: Configure musl compiler
  if: runner.os == 'Linux'
  shell: bash
  env:
    TARGET: ${{ matrix.targets[0] }}
  run: |
    target_key=${TARGET//-/_}
    echo "CC_${target_key}=musl-gcc" >> "$GITHUB_ENV"
    echo "CARGO_TARGET_${target_key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
