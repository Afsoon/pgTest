services:
  postgres:
    image: postgres:18-alpine
    container_name: pgtest-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
      POSTGRES_DB: pgtest
    volumes:
      - pgtest-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d pgtest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgtest-data:
