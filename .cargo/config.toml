# Matching target rustflags are combined; build.rustflags would be replaced by
# target-specific rustflags instead. Keep shared flags in this catch-all section.
[target.'cfg(all())']
# Next-generation trait solver (rust-lang/rust#160895).
# Default-on in current nightlies; kept explicit so the workspace still opts in
# if the default flips, and fails loudly on toolchains without it.
rustflags = ["-Znext-solver"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
linker = "gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
