[package]
name = "server"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true


[dependencies]
mimalloc = "0.1.52"
hotpath = { workspace = true, features = ["sqlx"] }
anyhow = { workspace = true }
serde_json = "1"
envconfig = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pgtest-core = { version = "=0.1.0", path = "../../crates/pgtest-core" }
pgtest-wire = { version = "=0.1.0", path = "../../crates/pgtest-wire" }
pgtest-database-operations = { version = "=0.1.0", path = "../../crates/pgtest-database-operations" }

[features]
default = []
hotpath = ["hotpath/hotpath", "pgtest-core/hotpath", "pgtest-wire/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "pgtest-core/hotpath-alloc", "pgtest-wire/hotpath-alloc"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus", "pgtest-core/hotpath-prometheus", "pgtest-wire/hotpath-prometheus"]
