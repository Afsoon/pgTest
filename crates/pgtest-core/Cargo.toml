[package]
name = "pgtest-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "pgtest"


[lints]
workspace = true

[dependencies]
sqlx = { version = "=0.9.0", features = ["postgres", "runtime-tokio"] }
rand = "0.10.2"
rustc-hash = "2.1.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-retry2 =  { version = "0.9.1", features = ["jitter", "tracing"] }
envconfig = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
testcontainers = { workspace = true, optional = true }
pgtest-container = { path = "../pgtest-container", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-test = "0.2.6"
testcontainers = { workspace = true }
pgtest-container = { path = "../pgtest-container"}

[features]
# Deterministic sequential database ids for the worker_engine simulations.
stable_ids = []
# Expose the container-backed PostgreSQL configuration to other crates' tests.
test-support = ["dep:testcontainers", "dep:pgtest-container"]
