[package]
name = "pgtest-database-operations"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
hotpath = { workspace = true }
sqlx = { version = "=0.9.0", features = ["postgres", "runtime-tokio"] }
rand = "0.10.2"
rustc-hash = "2.1.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-retry2 =  { version = "0.9.1", features = ["jitter", "tracing"] }
envconfig = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
testcontainers = { workspace = true, optional = true }
pgtest-utils = { path = "../pgtest-utils"}

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-test = "0.2.6"
testcontainers = { workspace = true }

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-prometheus = ["hotpath/hotpath-prometheus"]
# Expose the container-backed PostgreSQL configuration to other crates' tests.
test-support = ["dep:testcontainers"]
